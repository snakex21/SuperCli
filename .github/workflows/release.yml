name: Portable release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (x.y.z); packages a draft release'
        required: true
        default: '1.0.1'

permissions:
  contents: read

jobs:
  bundles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: windows, goarch: amd64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          node scripts/test-ui.cjs
          node docs/readme/check.cjs
      - name: Build portable bundle
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          mkdir -p bin dist
          EXT=""
          GUI_FLAGS=""
          if [ "$TARGET_OS" = "windows" ]; then EXT=".exe"; GUI_FLAGS="-H=windowsgui"; fi
          GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -X supercli/internal/buildinfo.Version=$RELEASE_VERSION" -o "bin/supercli$EXT" ./cmd/supercli
          GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w $GUI_FLAGS -X supercli/internal/buildinfo.Version=$RELEASE_VERSION" -o "bin/supercli-web$EXT" ./cmd/supercli-web
          go run ./scripts/release -version "$RELEASE_VERSION" -os "$TARGET_OS" -arch "$TARGET_ARCH" -cli "bin/supercli$EXT" -gui "bin/supercli-web$EXT" -output dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  draft:
    needs: bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: Create verification manifest and draft
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          go run ./scripts/release -manifest -version "$RELEASE_VERSION" -output dist
          NOTES_FILE="docs/releases/$RELEASE_VERSION.md"
          test -f "$NOTES_FILE"
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "v$RELEASE_VERSION" dist/*.zip dist/supercli-update.json dist/SHA256SUMS --draft --title "SuperCli $RELEASE_VERSION" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA"
