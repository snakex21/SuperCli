name: Portable release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (x.y.z); packages and publishes the release'
        required: true
        default: '1.0.17'

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      # Keep all six bundles together: no Node-based checkout/artifact actions.
      - name: Check out repository
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify
        run: |
          go version
          go test -timeout 8m ./...
          go vet ./...
          go run ./scripts/readme -check
      - name: Build six portable bundles
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          mkdir -p bin dist
          while read -r TARGET_OS TARGET_ARCH; do
            EXT=""
            GUI_FLAGS=""
            if [ "$TARGET_OS" = "windows" ]; then EXT=".exe"; GUI_FLAGS="-H=windowsgui"; fi
            GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -X supercli/internal/buildinfo.Version=$RELEASE_VERSION" -o "bin/supercli$EXT" ./cmd/supercli
            GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w $GUI_FLAGS -X supercli/internal/buildinfo.Version=$RELEASE_VERSION" -o "bin/supercli-web$EXT" ./cmd/supercli-web
            go run ./scripts/release -version "$RELEASE_VERSION" -os "$TARGET_OS" -arch "$TARGET_ARCH" -cli "bin/supercli$EXT" -gui "bin/supercli-web$EXT" -output dist
          done <<'TARGETS'
          windows amd64
          linux amd64
          linux arm64
          android arm64
          darwin amd64
          darwin arm64
          TARGETS
          go run ./scripts/release -manifest -version "$RELEASE_VERSION" -output dist
          test "$(find dist -maxdepth 1 -name '*.zip' | wc -l)" -eq 6
          (cd dist && sha256sum --check SHA256SUMS)
          for bundle in dist/*.zip; do unzip -tq "$bundle"; done
      - name: Publish public release
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          NOTES_FILE="docs/releases/$RELEASE_VERSION.md"
          test -f "$NOTES_FILE"
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release v$RELEASE_VERSION already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" dist/*.zip dist/supercli-update.json dist/SHA256SUMS --latest --title "SuperCli $RELEASE_VERSION" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA"
