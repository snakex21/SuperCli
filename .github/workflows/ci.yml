name: CI

on:
  push:
    branches: [public-main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build ./cmd/supercli
      - name: Build WebGUI
        run: go build ./cmd/supercli-web
