name: CI

on:
  push:
    branches: [main, public-main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: UI and documentation checks
        run: |
          node scripts/test-ui.cjs
          node --test docs/readme/check.test.cjs
          node docs/readme/check.cjs
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build ./cmd/supercli
      - name: Build WebGUI
        run: go build ./cmd/supercli-web
