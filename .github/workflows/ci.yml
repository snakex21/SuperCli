name: CI

on:
  push:
    branches: [main, public-main]
  pull_request:

permissions:
  contents: read

env:
  # The runner's Go bootstraps the exact toolchain required by go.mod.
  GOTOOLCHAIN: auto

jobs:
  verify:
    name: Go and native browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # JavaScript actions also execute Node, so checkout uses Git directly.
      - name: Check out repository
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify Go toolchain
        run: go version
      - name: Test Go, native browser UI and documentation
        run: go test -timeout 8m ./...
      - name: Check generated documentation
        run: go run ./scripts/readme -check
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build ./cmd/supercli
      - name: Build WebGUI
        run: go build ./cmd/supercli-web
      - name: Cross-compile Windows
        run: GOOS=windows go vet ./... && GOOS=windows go build ./cmd/supercli ./cmd/supercli-web
