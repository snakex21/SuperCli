apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels:
    app: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: registry.local/webapp:2.3.1
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: 256Mi
